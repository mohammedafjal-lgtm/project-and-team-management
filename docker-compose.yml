services:
  db:
    image: postgres:16-alpine
    container_name: ptm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ptm_dev
    ports:
      - "5432:5432"
    volumes:
      - ptm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ptm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ptm_pgdata: